name: Update training repo on merge

on:
  push:
    branches:
      - main
    paths:
      - "blog/**"
      - "authors/**"
      - "config.json"
      # The mirror also serves as a tutorial: keep its guides and skills in step.
      - "*.md"
      - ".claude/**"
      - ".hooks/**"
  workflow_dispatch:

jobs:
  update-training-repo:
    if: github.repository == 'zatsit-oss/zats-blog-content'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Force Push changes on content-training
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GH_PAT }}
          repository: zatsit-oss/zats-blog-content-training
          branch: main_training
          force: true

